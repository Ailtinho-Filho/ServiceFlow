services:
  postgres:
    image: postgres:16-alpine
    container_name: serviceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: serviceflow
      POSTGRES_DB: serviceflow
    ports:
      - "5432:5432"
    volumes:
      - serviceflow_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: serviceflow-api
    restart: unless-stopped
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://serviceflow:serviceflow@postgres:5432/serviceflow?schema=public
      JWT_SECRET: troque-esta-chave-em-producao
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres
    ports:
      - "3333:3333"

volumes:
  serviceflow_pgdata:
